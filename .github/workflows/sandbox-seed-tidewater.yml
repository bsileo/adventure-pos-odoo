# Install Tidewater standard package modules (if needed) and upsert Tidewater
# seed data on the shared GCP sandbox through Workload Identity Federation + IAP.
#
# Required secrets (same as Deploy GCP sandbox):
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_DEPLOY_SERVICE_ACCOUNT
# Required repository variables:
#   GCP_SANDBOX_INSTANCE (default: adventurepos-sandbox-vm)
#   GCP_SANDBOX_ZONE (default: us-central1-a)
#   GCP_SANDBOX_DEPLOY_PATH (default: /srv/adventurepos/adventure-pos-odoo)
#
# Does NOT wipe Postgres. Normal develop deploys still do not reseed —
# use workflow_dispatch for day-to-day refresh, or push a change to this file
# when bootstrapping new package modules after a merge.

name: Seed GCP sandbox Tidewater

on:
  workflow_dispatch:
    inputs:
      reset_seed:
        description: "Pass --reset-seed (recreate scenario/runtime records)"
        required: false
        default: false
        type: boolean
  push:
    branches: [develop]
    paths:
      - ".github/workflows/sandbox-seed-tidewater.yml"

concurrency:
  group: sandbox-seed-tidewater
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Install package modules and seed Tidewater
        env:
          PROJECT: adventure-pos-sandbox
          INSTANCE: ${{ vars.GCP_SANDBOX_INSTANCE || 'adventurepos-sandbox-vm' }}
          ZONE: ${{ vars.GCP_SANDBOX_ZONE || 'us-central1-a' }}
          DEPLOY_PATH: ${{ vars.GCP_SANDBOX_DEPLOY_PATH || '/srv/adventurepos/adventure-pos-odoo' }}
          RESET_SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.reset_seed || false }}
        run: |
          set -euo pipefail
          seed_args=()
          if [[ "${RESET_SEED}" == "true" ]]; then
            seed_args+=(--reset-seed)
          fi
          gcloud compute ssh "deploy@${INSTANCE}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --strict-host-key-checking=no \
            --command="set -euo pipefail; cd \"${DEPLOY_PATH}\"; git fetch --force origin develop:refs/remotes/origin/develop; git checkout develop; git reset --hard origin/develop; bash ./scripts/gcp-sandbox-seed-tidewater.sh ${seed_args[*]+"${seed_args[*]}"}"
