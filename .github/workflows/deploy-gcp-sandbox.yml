# Deploy the private shared sandbox through Workload Identity Federation + IAP.
# Required repository secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER
#   GCP_DEPLOY_SERVICE_ACCOUNT
# Required repository variables:
#   GCP_SANDBOX_INSTANCE (default: adventurepos-sandbox-vm)
#   GCP_SANDBOX_ZONE (default: us-central1-a)
#   GCP_SANDBOX_DEPLOY_PATH (default: /srv/adventurepos/adventure-pos-odoo)

name: Deploy GCP sandbox

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-gcp-sandbox
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Pull latest and restart Docker stack through IAP
        env:
          PROJECT: adventure-pos-sandbox
          INSTANCE: ${{ vars.GCP_SANDBOX_INSTANCE || 'adventurepos-sandbox-vm' }}
          ZONE: ${{ vars.GCP_SANDBOX_ZONE || 'us-central1-a' }}
          DEPLOY_PATH: ${{ vars.GCP_SANDBOX_DEPLOY_PATH || '/srv/adventurepos/adventure-pos-odoo' }}
        run: |
          set -euo pipefail
          gcloud compute ssh "deploy@${INSTANCE}" \
            --project="${PROJECT}" \
            --zone="${ZONE}" \
            --tunnel-through-iap \
            --quiet \
            --strict-host-key-checking=no \
            --command="set -euo pipefail; cd \"${DEPLOY_PATH}\"; git fetch origin; git checkout develop; git reset --hard origin/develop; docker compose up -d"
